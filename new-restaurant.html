<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo Restaurante</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-light">

   <!-- Navbar -->
 <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold fs-4" href="#">Directorio de Restaurante</a>
    <div class="ms-auto">
      <ul class="navbar-nav d-flex flex-row gap-3">
        <li class="nav-item">
          <a class="nav-link text-white" href="home.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="search.html">Buscar</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white" href="new-restaurant.html">Nuevo Restaurante</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <main class="max-w-2xl mx-auto mt-10 bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Crear Nuevo Restaurante</h2>
    <form id="restaurantForm" class="space-y-4">
      <div>
        <label for="nombre" class="block font-medium">Nombre:</label>
        <input type="text" id="nombre" name="nombre" class="w-full border rounded p-2" required>
      </div>
      <div>
        <label for="descripcion" class="block font-medium">Descripción:</label>
        <textarea id="descripcion" name="descripcion" class="w-full border rounded p-2" required></textarea>
      </div>
      <div>
        <label for="direccion" class="block font-medium">Dirección:</label>
        <input type="text" id="direccion" name="direccion" class="w-full border rounded p-2" required>
      </div>
      <div>
        <label for="imagen" class="block font-medium">URL de la Imagen:</label>
        <input type="url" id="imagen" name="imagen" class="w-full border rounded p-2" required>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Guardar Restaurante
      </button>
    </form>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
